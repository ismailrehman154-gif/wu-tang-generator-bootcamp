<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Wu tang Name generator</title>
</head>

<body>
    <form method="post">
        <h2>Answer the questions below to generate your Wu-Tang name <br>
        left is yes, middle is maybe, right is no</h2>
        <p>Are you a fan of Wu-Tang Clan?</p>
        <input type="radio" name="q1" value="a" class="choices">
        <input type="radio" name="q1" value="b" class="choices">
        <input type="radio" name="q1" value="c" class="choices">
 
        
        <p>Do you prefer the classic Wu-Tang sound?</p>
        <input type="radio" name="q2" value="a" class="choices">
        <input type="radio" name="q2" value="b" class="choices">
        <input type="radio" name="q2" value="c" class="choices">
 
        <p>Are you down like a clown?</p>
        <input type='radio' name='q3' value='a' class='choices'>
        <input type='radio' name='q3' value='b' class='choices'>
        <input type='radio' name='q3' value='c' class='choices'>
 
        <p>Are you up like a duck?</p>
        <input type="radio" name="q4" value="a" class="choices">
        <input type="radio" name="q4" value="b" class="choices">
        <input type="radio" name="q4" value="c" class="choices">
        
 
        
        <p>Are you a true Wu-Tang fan?</p>
        <input type="radio" name="q5" value="a" class="choices">
        <input type="radio" name="q5" value="b" class="choices">
        <input type="radio" name="q5" value="c" class="choices">
         <button type="button" id="gen">Generate Name</button>
    </form>
   
    
    <h3 id="result"></h3>
    <h2>Whats ya name</h2>
    <script src="js/main.js"></script>
</body>

</html>
